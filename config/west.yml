manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: oleksandrmaslov
      url-base: https://github.com/oleksandrmaslov
    - name: badjeff
      url-base: https://github.com/badjeff
    - name: halfdane
      url-base: https://github.com/halfdane
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk-soft-off-wake-delay
      remote: oleksandrmaslov
      revision: main
      # Add these if you want to use absolute mode:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    - name: zmk-kscan-blackout
      remote: badjeff
      revision: main 
  self:
    path: config
